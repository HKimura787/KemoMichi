<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>KemoMichi palette preview</title>
<style>
  :root {
    --primary: #0066BE; --primary-strong: #00428C; --surface: #E8F1FE; --accent: #F08A00;
    --text: #1A1A1A; --text-sub: #4D4D4D; --border: #767676; --divider: #CCCCCC;
    --focus: #FFD43D; --error: #CE0000; --warning: #927200; --success: #197A4B; --viewer: #333333;
  }
  .plan-b { --primary: #0031D8; --primary-strong: #00118F; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", sans-serif;
         font-size: 16px; letter-spacing: .02em; background: #F2F2F2; color: var(--text); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  p.note { margin: 0 0 16px; color: var(--text-sub); font-size: 14px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; }
  .app { width: 780px; background: #fff; border: 1px solid var(--divider); }
  .bar { background: var(--primary); color: #fff; height: 48px; display: flex; align-items: center;
         padding: 0 16px; gap: 16px; font-weight: 700; font-size: 16px; }
  .bar .sp { flex: 1; }
  .bar .tag { background: #fff; color: var(--text); font-size: 14px; padding: 2px 8px; border-radius: 4px;
              display: flex; align-items: center; gap: 6px; }
  .bar .tag i { width: 8px; height: 8px; background: var(--accent); display: inline-block; }
  .bar .light { font-weight: 400; font-size: 14px; }
  .panes { display: grid; grid-template-columns: 170px 1fr 240px; height: 430px; }
  .pane { background: #fff; border-right: 1px solid var(--divider); overflow: hidden; }
  .pane:last-child { border-right: 0; border-left: 1px solid var(--divider); }
  .ph { background: var(--surface); color: var(--primary); font-weight: 700; padding: 8px 12px; font-size: 16px; }
  .pb { padding: 8px 12px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 8px; background: var(--surface);
          color: var(--primary); font-size: 14px; font-weight: 700; margin: 0 4px 4px 0; }
  .chip.on { background: var(--primary); color: #fff; }
  .tree div { padding: 2px 0; }
  .tree .sel { background: var(--primary); color: #fff; padding: 2px 6px; }
  .viewer { background: var(--viewer); display: flex; flex-direction: column; }
  .img { flex: 1; margin: 12px; background: linear-gradient(#8a9a7a, #5f6b52); position: relative; }
  .tri { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bbox { position: absolute; border: 2px solid #E69F00; outline: 1px solid #000; }
  .bbox span { position: absolute; top: -22px; left: -2px; background: #000; color: #fff; font-size: 14px;
               font-weight: 700; padding: 0 4px; border-radius: 4px; }
  .timeline { height: 40px; margin: 0 12px 12px; background: #4d4d4d; position: relative; }
  .seg { position: absolute; top: 8px; height: 24px; background: rgba(157,183,249,.45); border-radius: 4px;
         color: #fff; font-size: 14px; padding: 1px 6px; font-weight: 700; }
  .head { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--accent); }
  .tc { color: #fff; font-family: "Noto Sans Mono", ui-monospace, Consolas, monospace; font-size: 14px; margin: 0 12px 6px; }
  .palette { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .sp-btn { min-height: 44px; border: 1px solid var(--primary); color: var(--primary); background: #fff;
            border-radius: 8px; padding: 4px 6px 4px 18px; font-weight: 700; position: relative; font-size: 14px; }
  .sp-btn small { display: block; font-weight: 400; font-size: 14px; }
  .sp-btn.on { background: var(--primary); color: #fff; }
  .sp-btn.on::before { content: ""; position: absolute; top: 8px; left: 6px; width: 7px; height: 7px; background: #fff; }
  .field label { display: block; font-size: 14px; color: var(--text-sub); }
  .field input { width: 100%; height: 36px; border: 1px solid var(--border); border-radius: 8px; padding: 0 8px;
                 background: #fff; color: var(--text); font: inherit; font-size: 16px; }
  .field.err input { border: 2px solid var(--error); }
  .field .msg { color: var(--error); font-size: 14px; }
  .field.focus input { outline: 4px solid #000; outline-offset: 0; box-shadow: 0 0 0 7px var(--focus); }
  .btns { display: flex; gap: 8px; margin-top: 4px; }
  .btn { height: 36px; padding: 0 14px; border-radius: 8px; font: inherit; font-size: 16px; font-weight: 700; }
  .btn.main { background: var(--accent); color: var(--text); border: 1px solid var(--accent); }
  .btn.sub { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
  .status { font-size: 14px; display: flex; gap: 12px; }
  .status .w { color: var(--warning); font-weight: 700; } .status .s { color: var(--success); font-weight: 700; }
  .sw { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 14px; }
  .sw b { display: block; width: 96px; height: 28px; border: 1px solid var(--divider); }
</style>
</head>
<body>
<h1>KemoMichi パレット見本（ライトテーマ）</h1>
<p class="note">左: 案 A 明るい青 #0066BE（推奨）／右: 案 B 鮮やかな青 #0031D8（デジタル庁のキーカラー）。色・書体・角の丸みはデジタル庁デザイントークンの値。画像の周りは色を持たない灰色。</p>
<div class="row">
  <div><h2>案 A: 明るい青 #0066BE</h2><div class="app" id="a"></div></div>
  <div class="plan-b"><h2>案 B: 鮮やかな青 #0031D8</h2><div class="app" id="b"></div></div>
</div>
<div class="sw">
  <div><b style="background:#0066BE"></b>主色 A #0066BE</div>
  <div><b style="background:#0031D8"></b>主色 B #0031D8</div>
  <div><b style="background:#E8F1FE"></b>面 #E8F1FE</div>
  <div><b style="background:#F08A00"></b>アクセント #F08A00</div>
  <div><b style="background:#333333"></b>ビューア #333333</div>
  <div><b style="background:#FFD43D"></b>フォーカス #FFD43D</div>
  <div><b style="background:#CE0000"></b>エラー #CE0000</div>
  <div><b style="background:#927200"></b>警告 #927200</div>
  <div><b style="background:#197A4B"></b>成功 #197A4B</div>
</div>
<template id="tpl">
  <div class="bar"><span>KemoMichi</span><span class="light">サイトA_2026春.ddb</span><span class="sp"></span>
    <span class="tag"><i></i>未保存</span><span class="light">この PC</span><span class="light">日本語 / EN</span></div>
  <div class="panes">
    <div class="pane"><div class="ph">フォルダ</div><div class="pb tree">
      <div>CamA</div><div class="sel">CamA/2026-04</div><div>CamB</div>
      <div class="ph" style="margin:8px -12px 0">フィルタ</div>
      <div><span class="chip on">種: タヌキ ×</span><span class="chip">未入力のみ</span><span class="chip">夜間</span></div>
    </div></div>
    <div class="viewer">
      <div class="img">
        <svg class="tri" viewBox="0 0 100 100" preserveAspectRatio="none">
          <polygon points="20,85 50,30 80,85" fill="rgba(255,255,255,.15)" stroke="#000" stroke-width="1.2"/>
          <polygon points="20,85 50,30 80,85" fill="none" stroke="#fff" stroke-width=".6"/>
        </svg>
        <div class="bbox" style="left:38%;top:48%;width:22%;height:28%"><span>タヌキ #1</span></div>
      </div>
      <div class="tc">00:00:04.170 / フレーム 125</div>
      <div class="timeline"><div class="seg" style="left:20%;width:35%">区間1 S–E</div><div class="head" style="left:42%"></div></div>
    </div>
    <div class="pane"><div class="ph">データ入力</div><div class="pb">
      <div class="palette">
        <div class="sp-btn on">タヌキ<small>1・個数 2</small></div>
        <div class="sp-btn">キツネ<small>2</small></div>
        <div class="sp-btn on">アナグマ<small>3・個数 1</small></div>
        <div class="sp-btn">その他<small>0</small></div>
      </div>
      <div class="field focus"><label>メモ</label><input value="フォーカス中"></div>
      <div class="field err"><label>個数（必須）</label><input value="abc"><div class="msg">✕ 整数を入力してください</div></div>
      <div class="status"><span class="w">! 時刻が不一致</span><span class="s">✓ 保存しました</span></div>
      <div class="btns"><button class="btn main">計測を確定</button><button class="btn sub">戻す</button></div>
    </div></div>
  </div>
</template>
<script>
  for (const id of ["a", "b"]) document.getElementById(id).innerHTML = document.getElementById("tpl").innerHTML;
</script>
</body>
</html>

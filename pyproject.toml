[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kemomichi"
version = "0.1.0"
description = "Cross-platform camera trap review app compatible with Timelapse2 project files"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "Pillow>=11.0",
]

[project.optional-dependencies]
# For `pip install -e ".[dev]"`. uv users get the same set from [dependency-groups].
dev = ["pytest>=8.3", "httpx>=0.28"]

[dependency-groups]
desktop = [
    "pyinstaller>=6.16,<7",
]
dev = ["pytest>=8.3", "httpx>=0.28"]

[project.scripts]
kemo = "kemoserver.cli:main"
kemo-desktop = "kemoserver.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kemoserver = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
